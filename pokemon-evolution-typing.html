<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しんかタイピング図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121018;
    --bg-panel:#1c1721;
    --bg-panel-2:#2a223080;
    --paper:#f3ead8;
    --paper-line:#d9cba8;
    --ink:#2a2118;
    --gold:#e0a415;
    --gold-bright:#f6c945;
    --red:#d43a34;
    --red-dark:#932420;
    --blue:#3c6fc4;
    --jade:#4f8f6d;
    --text:#eae5d8;
    --text-dim:#a99fae;
    --border:#3a3145;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 15% -10%, #2c2138 0%, transparent 55%),
      radial-gradient(ellipse at 100% 15%, #241c1a 0%, transparent 45%),
      var(--bg);
    color:var(--text);font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Shippori Mincho', serif;}
  .mono{font-family:'JetBrains Mono', monospace;}
  #app{max-width:720px;margin:0 auto;padding:20px 16px 64px;}

  .top-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;margin-bottom:22px;
    background:linear-gradient(180deg, #241c30, #191420);
    border:1px solid var(--border);border-radius:14px;position:relative;overflow:hidden;
  }
  .top-header::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(135deg, rgba(230,164,21,0.05) 0 2px, transparent 2px 14px);
    pointer-events:none;
  }
  .title-wrap{display:flex;align-items:center;gap:12px;}
  .title-wrap h1{font-size:1.35rem;margin:0;letter-spacing:.04em;font-weight:800;color:var(--gold-bright);}
  .title-wrap .sub{font-size:.65rem;color:var(--text-dim);letter-spacing:.18em;margin-top:2px;}
  .dex-badge{
    display:flex;align-items:center;gap:8px;background:var(--bg-panel-2);
    border:1px solid var(--border);padding:7px 12px;border-radius:999px;font-size:.8rem;
  }

  .panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:18px;}
  .panel h2{font-family:'Shippori Mincho',serif;font-size:1.1rem;margin:0 0 12px;color:var(--gold-bright);display:flex;align-items:center;gap:8px;}
  .btn{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;border:none;border-radius:10px;padding:14px 22px;font-size:1rem;cursor:pointer;transition:transform .12s ease, filter .12s ease;letter-spacing:.03em;}
  .btn:active{transform:scale(.97);}
  .btn-main{background:linear-gradient(180deg, var(--red), var(--red-dark));color:#fff8ee;box-shadow:0 3px 0 #611613, 0 8px 20px -6px rgba(212,58,52,.5);}
  .btn-main:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold-bright);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}

  /* dex grid */
  .dex-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .dex-cell{
    aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#191420;border:1px solid var(--border);font-size:1.3rem;text-align:center;gap:2px;padding:4px;
  }
  .dex-cell.caught{background:linear-gradient(160deg,#2c2013,#1c1a12);border-color:var(--gold);}
  .dex-cell .nm{font-size:.55rem;color:var(--text-dim);line-height:1.2;}
  .dex-cell.caught .nm{color:var(--gold-bright);}
  .dex-empty-note{color:var(--text-dim);font-size:.82rem;text-align:center;padding:10px 0 2px;}

  /* encounter */
  .encounter-banner{font-family:'Shippori Mincho',serif;color:var(--gold-bright);font-size:1.05rem;margin:0 0 12px;}
  .stage-dots{display:flex;gap:6px;margin-bottom:14px;}
  .stage-dot{width:26px;height:8px;border-radius:99px;background:#2a2434;border:1px solid var(--border);}
  .stage-dot.done{background:var(--jade);border-color:var(--jade);}
  .stage-dot.current{background:var(--gold-bright);border-color:var(--gold-bright);}

  .name-box{
    background:var(--paper);color:var(--ink);border-radius:12px;padding:26px 20px;
    font-family:'JetBrains Mono',monospace;font-size:1.6rem;line-height:1.6;letter-spacing:.04em;
    text-align:center;margin-bottom:14px;box-shadow:0 10px 24px -12px rgba(0,0,0,.5);
  }
  .ch{position:relative;}
  .ch.correct{color:var(--jade);}
  .ch.wrong{color:var(--red);background:rgba(212,58,52,.15);border-radius:2px;}
  .ch.pending{color:#b8a97e;}
  .ch.cursor{border-bottom:2px solid var(--red-dark);}

  @keyframes shakeError{
    10%,90%{transform:translateX(-3px);}20%,80%{transform:translateX(5px);}
    30%,50%,70%{transform:translateX(-9px);}40%,60%{transform:translateX(9px);}
  }
  .name-box.shake-error{animation:shakeError .45s;border:2px solid var(--red);box-shadow:0 0 0 4px rgba(212,58,52,.18);}

  .pace-track{position:relative;height:38px;margin:2px 0 14px;background:linear-gradient(180deg,#241f14,#191710);border:1px solid var(--paper-line);border-radius:8px;overflow:hidden;}
  .pace-track::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg, rgba(217,203,168,.12) 0 2px, transparent 2px 22px);}
  .pace-goal{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:1.15rem;z-index:1;}
  .pace-walker{position:absolute;left:2%;top:50%;transform:translateY(-50%);font-size:1.4rem;transition:left linear;z-index:2;}
  .pace-walker.done{filter:grayscale(1) brightness(.7);}
  .pace-label{font-size:.68rem;color:var(--text-dim);margin:-6px 0 10px;text-align:right;}

  .type-input{width:100%;padding:14px 16px;font-size:1.15rem;border-radius:10px;border:1px solid var(--border);background:#0e0c14;color:var(--text);font-family:'JetBrains Mono',monospace;outline:none;text-align:center;letter-spacing:.05em;}
  .type-input:focus{border-color:var(--gold);}

  .big-banner{
    position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.75);
    background:linear-gradient(180deg,#241a16,#171009);border:3px solid var(--red);color:#fff3e6;
    padding:20px 30px;border-radius:16px;font-family:'Shippori Mincho',serif;font-size:1.5rem;font-weight:800;
    text-align:center;z-index:80;opacity:0;pointer-events:none;box-shadow:0 20px 50px -10px rgba(0,0,0,.65);
    transition:opacity .15s ease, transform .15s ease;max-width:82vw;
  }
  .big-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .big-banner .sub{display:block;font-family:'Zen Kaku Gothic New',sans-serif;font-size:.8rem;font-weight:500;margin-top:6px;color:#e0b6a0;}
  .big-banner.ok{border-color:var(--jade);}
  .big-banner.evo{border-color:var(--blue);}

  .catch-hero{text-align:center;padding:10px 0 6px;}
  .catch-hero .ball{font-size:3rem;}
  .catch-hero h2{font-family:'Shippori Mincho',serif;font-size:1.4rem;color:var(--gold-bright);margin:8px 0 4px;}
  .catch-hero p{color:var(--text-dim);font-size:.88rem;margin:0;}

  .save-status{border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:.85rem;line-height:1.7;}
  .save-status.ok{background:rgba(79,143,109,.12);border:1px solid var(--jade);color:#bfe3cf;}
  .save-status.warn{background:rgba(212,58,52,.1);border:1px solid var(--red);color:#f3c9c0;}

  .empty-note{color:var(--text-dim);font-size:.85rem;text-align:center;padding:8px 0;}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<div id="app"></div>
<div class="big-banner" id="bigBanner"></div>

<script>
(function(){
  "use strict";

  /* ============ 進化系列データ ============ */
  const CHAINS = [
    ["ヒトカゲ","リザード","リザードン"],
    ["ゼニガメ","カメール","カメックス"],
    ["フシギダネ","フシギソウ","フシギバナ"],
    ["コラッタ","ラッタ"],
    ["ポッポ","ピジョン","ピジョット"],
    ["キャタピー","トランセル","バタフリー"],
    ["ビードル","コクーン","スピアー"],
    ["コイキング","ギャラドス"],
    ["イシツブテ","ゴローン","ゴローニャ"],
    ["ポニータ","ギャロップ"],
    ["ドガース","マタドガス"],
    ["ゴース","ゴースト","ゲンガー"],
    ["ズバット","ゴルバット","クロバット"],
    ["タツベイ","コモルー","ボーマンダ"],
    ["ヒコザル","モウカザル","ゴウカザル"],
    ["ポッチャマ","ポッタイシ","エンペルト"],
    ["ナエトル","ハヤシガメ","ドダイトス"],
    ["ツタージャ","ジャノビー","ジャローダ"],
    ["ポカブ","チャオブー","エンブオー"],
    ["ミジュマル","フタチマル","ダイケンキ"],
    ["ハリマロン","ハリボーグ","ブリガロン"],
    ["フォッコ","テールナー","マフォクシー"],
    ["ケロマツ","ゲコガシラ","ゲッコウガ"],
    ["サルノリ","バチンキー","ゴリランダー"],
    ["ヒバニー","ラビフット","エースバーン"],
    ["メッソン","ジメレオン","インテレオン"],
    ["モクロー","フクスロー","ジュナイパー"],
    ["ニャビー","ニャヒート","ガオガエン"],
    ["アシマリ","オシャマリ","アシレーヌ"],
    ["オニスズメ","オニドリル"],
    ["アーボ","アーボック"],
    ["ピカチュウ","ライチュウ"],
    ["サンド","サンドパン"],
    ["ニドラン♀","ニドリーナ","ニドクイン"],
    ["ニドラン♂","ニドリーノ","ニドキング"],
    ["ロコン","キュウコン"],
    ["ナゾノクサ","クサイハナ","ラフレシア"],
    ["パラス","パラセクト"],
    ["コンパン","モルフォン"],
    ["ディグダ","ダグトリオ"],
    ["ニャース","ペルシアン"],
    ["コダック","ゴルダック"],
    ["マンキー","オコリザル"],
    ["ガーディ","ウィンディ"],
    ["ニョロモ","ニョロゾ","ニョロボン"],
    ["ケーシィ","ユンゲラー","フーディン"],
    ["ワンリキー","ゴーリキー","カイリキー"],
    ["メノクラゲ","ドククラゲ"],
    ["コイル","レアコイル","ジバコイル"],
    ["ビリリダマ","マルマイン"],
    ["カラカラ","ガラガラ"],
    ["イワーク","ハガネール"],
    ["サイホーン","サイドン","ドサイドン"],
    ["タッツー","シードラ"],
    ["トサキント","アズマオウ"],
    ["ドードー","ドードリオ"],
    ["パウワウ","ジュゴン"],
    ["ベトベター","ベトベトン"],
    ["シェルダー","パルシェン"],
    ["ミニリュウ","ハクリュー","カイリュー"],
    ["イーブイ","ブースター"],
    ["チコリータ","ベイリーフ","メガニウム"],
    ["ヒノアラシ","マグマラシ","バクフーン"],
    ["ワニノコ","アリゲイツ","オーダイル"],
    ["オタチ","オオタチ"],
    ["ホーホー","ヨルノズク"],
    ["イトマル","アリアドス"],
    ["チョンチー","ランターン"],
    ["トゲピー","トゲチック"],
    ["ネイティ","ネイティオ"],
    ["メリープ","モココ","デンリュウ"],
    ["クヌギダマ","フォレトス"],
    ["ハネッコ","ポポッコ","ワタッコ"],
    ["ヒマナッツ","キマワリ"],
    ["マリル","マリルリ"],
    ["ウリムー","ウソッキー"],
    ["ヒメグマ","リングマ"],
    ["ドンメル","バクーダ"],
    ["ヨマワル","サマヨール"],
    ["タマザラシ","トドグラー","トドゼルガ"],
    ["ヨーギラス","サナギラス","バンギラス"],
    ["キモリ","ジュプトル","ジュカイン"],
    ["アチャモ","ワカシャモ","バシャーモ"],
    ["ミズゴロウ","ヌマクロー","ラグラージ"],
    ["ポチエナ","グラエナ"],
    ["ジグザグマ","マッスグマ"],
    ["ケムッソ","カラサリス","アゲハント"],
    ["タネボー","コノハナ","ダーテング"],
    ["スバメ","オオスバメ"],
    ["チルット","チルタリス"],
    ["ハスボー","ハスブレロ","ルンパッパ"],
    ["アメタマ","アメモース"],
    ["キノココ","キノガッサ"],
    ["ナマケロ","ヤルキモノ","ケッキング"],
    ["エネコ","エネコロロ"],
    ["ゴクリン","マルノーム"],
    ["サボネア","ノクタス"],
    ["キバニア","サメハダー"],
    ["ホエルコ","ホエルオー"],
    ["バネブー","ブーピッグ"],
    ["ナックラー","ビブラーバ","フライゴン"],
    ["ラルトス","キルリア","サーナイト"],
    ["キャモメ","ペリッパー"],
    ["タマタマ","ナッシー"],
    ["カゲボウズ","ジュペッタ"]
  ];

  const PACE_CPS = { slow: 0.9, normal: 1.4, fast: 2.0 }; // characters per second
  const PACE_LABELS = { slow: "おそい", normal: "ふつう", fast: "はやい" };

  /* ============ state ============ */
  const S = {
    screen: 'home', // home | encounter | caught | fled
    pace: 'normal',
    chainQueue: [],
    caught: [],          // array of final-stage names, persisted
    storageOk: true,
    enc: { chainIdx:-1, stage:0, typed:"", startTime:0, paceTimerId:null, paceSeconds:0 },
    lastResult: null,    // {caughtName, persisted} or {fledName}
  };

  /* ============ storage ============ */
  // Uses localStorage, keyed to this page's URL -- the approach that has
  // reliably persisted data for this family's other apps (hosted on GitHub
  // Pages), unlike the artifact window.storage API this file used before.
  const LS_PREFIX = 'evoTypingDex:';
  function loadCaught(){
    try{
      const v = localStorage.getItem(LS_PREFIX+'caught-list');
      S.caught = v ? JSON.parse(v) : [];
    }catch(e){
      S.storageOk = false;
      S.caught = [];
    }
  }
  function saveCaught(){
    try{
      localStorage.setItem(LS_PREFIX+'caught-list', JSON.stringify(S.caught));
      return true;
    }catch(e){ return false; }
  }
  function loadPace(){
    try{
      const v = localStorage.getItem(LS_PREFIX+'settings:pace');
      if(v && PACE_CPS[JSON.parse(v)]) S.pace = JSON.parse(v);
    }catch(e){ /* default is fine */ }
  }
  function savePace(){
    try{ localStorage.setItem(LS_PREFIX+'settings:pace', JSON.stringify(S.pace)); }catch(e){ /* session-only ok */ }
  }

  /* ============ render root ============ */
  function render(){
    const app = document.getElementById('app');
    app.innerHTML = header() + body();
    attachHandlers();
  }
  function header(){
    return `
    <div class="top-header">
      <div class="title-wrap">
        <span style="font-size:1.6rem;">🔴</span>
        <div><h1>しんかタイピング図鑑</h1><div class="sub">EVOLUTION TYPING DEX</div></div>
      </div>
      <div class="dex-badge">📖 ${S.caught.length}/${CHAINS.length} 匹</div>
    </div>`;
  }
  function body(){
    if(S.screen === 'home') return homeScreen();
    if(S.screen === 'encounter') return encounterScreen();
    if(S.screen === 'caught') return caughtScreen();
    if(S.screen === 'fled') return fledScreen();
    return '';
  }

  /* ---------- HOME ---------- */
  function homeScreen(){
    return `
    <div class="panel">
      <h2>🌿 野生のポケモンをさがす</h2>
      <p style="color:var(--text-dim);margin:0 0 16px;font-size:.9rem;line-height:1.7;">
        制限時間内に名前を打ちきると進化！最終形まで打ちきれたら「ゲットだぜ！」で図鑑に登録されるよ。<br>
        にんじゃに追いつかれる前に、正確に打とう。
      </p>
      <div class="btn-row"><button class="btn btn-main" id="huntBtn">たたかう！</button></div>
    </div>
    <div class="panel">
      <h2>🥷 にんじゃの速さ</h2>
      <p style="color:var(--text-dim);margin:0 0 12px;font-size:.85rem;">名前を打つ制限時間の目安。追いつかれると、そのポケモンには逃げられてしまう。</p>
      <div class="btn-row">
        <button class="btn ${S.pace==='slow'?'btn-main':'btn-ghost'}" data-pace="slow">おそい</button>
        <button class="btn ${S.pace==='normal'?'btn-main':'btn-ghost'}" data-pace="normal">ふつう</button>
        <button class="btn ${S.pace==='fast'?'btn-main':'btn-ghost'}" data-pace="fast">はやい</button>
      </div>
    </div>
    <div class="panel">
      <h2>📖 ずかん</h2>
      ${dexGridHTML()}
    </div>`;
  }
  function dexGridHTML(){
    if(CHAINS.length === 0) return `<div class="dex-empty-note">まだデータがありません。</div>`;
    let cells = '';
    CHAINS.forEach(chain=>{
      const finalName = chain[chain.length-1];
      const got = S.caught.includes(finalName);
      cells += `<div class="dex-cell ${got?'caught':''}">
        <span>${got ? '🔴' : '⚫'}</span>
        <span class="nm">${got ? escapeHtml(finalName) : '？？？'}</span>
      </div>`;
    });
    return `<div class="dex-grid">${cells}</div>`;
  }

  /* ---------- ENCOUNTER ---------- */
  function encounterScreen(){
    const e = S.enc;
    const chain = CHAINS[e.chainIdx];
    const target = chain[e.stage];
    return `
    <div class="panel">
      <p class="encounter-banner">野生の <b>${e.stage===0?escapeHtml(target):'？？？'}</b> があらわれた！</p>
      <div class="stage-dots">
        ${chain.map((_,i)=>`<span class="stage-dot ${i<e.stage?'done':(i===e.stage?'current':'')}"></span>`).join('')}
      </div>
      <div class="name-box" id="nameBox">${targetNameHtml()}</div>
      <div class="pace-track"><span class="pace-walker" id="paceWalker">🥷</span><span class="pace-goal">🚩</span></div>
      <div class="pace-label">目標ペース：${PACE_LABELS[S.pace]}</div>
      <input type="text" class="type-input" id="typeInput" placeholder="なまえをうちこもう" autocomplete="off" autocapitalize="off" spellcheck="false" value="${escapeAttr(e.typed)}">
      <p style="color:var(--text-dim);font-size:.72rem;margin:10px 0 0;text-align:center;">1文字でも間違えたままだと先に進めないよ。にんじゃに追いつかれると逃げられてしまう！</p>
      <div class="btn-row" style="margin-top:12px;justify-content:center;">
        <button class="btn btn-ghost" id="giveUpBtn">あきらめる</button>
      </div>
    </div>`;
  }
  function targetNameHtml(){
    const e = S.enc;
    const target = CHAINS[e.chainIdx][e.stage];
    const typed = e.typed;
    let chars = '';
    for(let i=0;i<target.length;i++){
      let cls = 'pending';
      if(i < typed.length) cls = (typed[i] === target[i]) ? 'correct' : 'wrong';
      if(i === typed.length) cls += ' cursor';
      chars += `<span class="ch ${cls}">${escapeHtml(target[i])}</span>`;
    }
    return chars;
  }
  function updateEncounterUI(){
    const box = document.getElementById('nameBox');
    if(box) box.innerHTML = targetNameHtml();
  }

  /* ---------- CAUGHT / FLED result screens ---------- */
  function caughtScreen(){
    const r = S.lastResult || {};
    return `
    <div class="panel">
      <div class="catch-hero">
        <div class="ball">🔴</div>
        <h2>やったー！<br>${escapeHtml(r.caughtName||'')}を、ゲットだぜ！</h2>
        <p>図鑑に登録されたよ。</p>
      </div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-main" id="backHomeBtn">図鑑にもどる</button>
      </div>
    </div>`;
  }
  function fledScreen(){
    const r = S.lastResult || {};
    return `
    <div class="panel">
      <div class="catch-hero">
        <div class="ball">💨</div>
        <h2>しまった…！<br>${escapeHtml(r.fledName||'野生のポケモン')}に、にげられた！</h2>
        <p>また探しに行こう。</p>
      </div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-main" id="backHomeBtn">図鑑にもどる</button>
      </div>
    </div>`;
  }

  /* ============ handlers ============ */
  function attachHandlers(){
    const huntBtn = document.getElementById('huntBtn');
    if(huntBtn) huntBtn.onclick = startEncounter;

    document.querySelectorAll('[data-pace]').forEach(btn=>{
      btn.onclick = () => { S.pace = btn.getAttribute('data-pace'); savePace(); render(); };
    });

    const typeInput = document.getElementById('typeInput');
    if(typeInput){
      typeInput.focus();
      typeInput.addEventListener('input', onTypeInput);
      typeInput.addEventListener('compositionend', onCompositionEnd);
    }
    const giveUpBtn = document.getElementById('giveUpBtn');
    if(giveUpBtn) giveUpBtn.onclick = () => {
      stopPacer();
      const chain = CHAINS[S.enc.chainIdx];
      endEncounter('fled', chain[0]);
    };

    const backHomeBtn = document.getElementById('backHomeBtn');
    if(backHomeBtn) backHomeBtn.onclick = () => { S.screen='home'; render(); };
  }

  /* ---------- encounter draw (no-repeat bag) ---------- */
  function drawChainIndex(){
    if(S.chainQueue.length === 0){
      const idxs = CHAINS.map((_,i)=>i);
      for(let j=idxs.length-1;j>0;j--){
        const k = Math.floor(Math.random()*(j+1));
        [idxs[j],idxs[k]] = [idxs[k],idxs[j]];
      }
      S.chainQueue = idxs;
    }
    return S.chainQueue.pop();
  }

  function startEncounter(){
    const chainIdx = drawChainIndex();
    S.enc = { chainIdx, stage:0, typed:"", startTime: Date.now(), paceTimerId:null, paceSeconds:0 };
    S.screen = 'encounter';
    render();
    startPacer();
  }

  function onTypeInput(e){
    S.enc.typed = e.target.value;
    updateEncounterUI();
    if(e.isComposing) return; // wait for IME conversion to commit before judging
    checkStageCompletion(e.target);
  }
  function onCompositionEnd(e){
    S.enc.typed = e.target.value;
    updateEncounterUI();
    checkStageCompletion(e.target);
  }

  function checkStageCompletion(inputEl){
    const e = S.enc;
    const chain = CHAINS[e.chainIdx];
    const target = chain[e.stage];
    if(e.typed.length < target.length) return;
    const exact = e.typed.length === target.length && e.typed === target;
    if(exact){
      stopPacer();
      if(e.stage < chain.length - 1){
        const oldName = target, newName = chain[e.stage+1];
        showBanner('🌟 進化！', `${oldName} → ${newName}`, 1300, false, true);
        e.stage++; e.typed = "";
        if(inputEl) inputEl.value = "";
        setTimeout(()=>{
          if(S.screen !== 'encounter') return;
          render(); // re-mount for the new stage's fresh name-box/pace-track
          startPacer();
        }, 900);
      } else {
        showBanner('⭕ せいかい！', null, 500, true);
        setTimeout(()=>{ catchPokemon(target); }, 550);
      }
    } else {
      const box = document.getElementById('nameBox');
      if(box){ box.classList.remove('shake-error'); void box.offsetWidth; box.classList.add('shake-error'); }
      showBanner('❌ ちがう！', 'なおしてもう一度', 900);
    }
  }

  function showBanner(mainText, subText, ms, ok, evo){
    const el = document.getElementById('bigBanner');
    if(!el) return;
    el.innerHTML = `${escapeHtml(mainText)}${subText ? `<span class="sub">${escapeHtml(subText)}</span>` : ''}`;
    el.classList.remove('ok','evo');
    if(ok) el.classList.add('ok');
    if(evo) el.classList.add('evo');
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    if(el._hideTimer) clearTimeout(el._hideTimer);
    el._hideTimer = setTimeout(()=>{ el.classList.remove('show'); }, ms || 1100);
  }

  /* ---------- pacer ---------- */
  function startPacer(){
    const e = S.enc;
    const chain = CHAINS[e.chainIdx];
    const target = chain[e.stage];
    const cps = PACE_CPS[S.pace] || PACE_CPS.normal;
    const seconds = Math.max(3, (target ? target.length : 0) / cps);
    e.paceSeconds = seconds;
    if(e.paceTimerId) clearTimeout(e.paceTimerId);
    e.paceTimerId = setTimeout(onPaceTimeout, seconds * 1000);
    const walker = document.getElementById('paceWalker');
    if(walker){
      walker.classList.remove('done');
      walker.style.transition = 'none';
      walker.style.left = '2%';
      void walker.offsetWidth;
      walker.style.transition = `left ${seconds}s linear`;
      requestAnimationFrame(()=>{ walker.style.left = '94%'; });
    }
  }
  function stopPacer(){
    if(S.enc.paceTimerId){ clearTimeout(S.enc.paceTimerId); S.enc.paceTimerId = null; }
  }
  function onPaceTimeout(){
    if(S.screen !== 'encounter') return;
    const chain = CHAINS[S.enc.chainIdx];
    const walker = document.getElementById('paceWalker');
    if(walker) walker.classList.add('done');
    showBanner('⏰ タイムオーバー！', 'にんじゃに追いつかれた…', 1300);
    setTimeout(()=>{ endEncounter('fled', chain[0]); }, 1000);
  }

  function catchPokemon(finalName){
    if(!S.caught.includes(finalName)) S.caught.push(finalName);
    const persisted = saveCaught();
    S.lastResult = { caughtName: finalName, persisted };
    S.screen = 'caught';
    render();
  }
  function endEncounter(kind, chainStartName){
    stopPacer();
    if(kind === 'fled'){
      S.lastResult = { fledName: chainStartName };
      S.screen = 'fled';
      render();
    }
  }

  /* ---------- utils ---------- */
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  /* ============ init ============ */
  (function init(){
    loadPace();
    loadCaught();
    render();
  })();
})();
</script>
</body>
</html>
